<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>關鍵字主控台｜MaKarma</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/*CSS*/
main{padding:24px 0 80px}
.list{display:grid;gap:0;border-top:2px solid var(--ink)}
.li{display:grid;grid-template-columns:minmax(0,2fr) 1.3fr 1.2fr 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--pale)}
.li b{font-size:16px}
.bar2{height:6px;background:var(--pale);border-radius:3px;overflow:hidden;margin-top:4px}.bar2 i{display:block;height:100%;background:var(--cyan)}
.sub{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px;flex-wrap:wrap}
.sub button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.sub button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pale);padding:10px 14px;border-radius:10px;font-size:14px}
.linkbox code{font-family:var(--font);word-break:break-all}
table.ed td{padding:4px 6px}
table.ed input.in,table.ed select.in{padding:5px 7px;font-size:13.5px}
.catrow{display:grid;grid-template-columns:2fr 3fr auto auto;gap:8px;align-items:center;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.q-ed{border-bottom:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.q-ed .r{display:grid;grid-template-columns:2fr 1fr 9em auto;gap:6px}
tr.sel td{background:color-mix(in srgb,var(--orange) 8%,transparent)}
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.modebar{display:flex;gap:4px;background:var(--pale);border:1px solid var(--line);border-radius:10px;padding:3px}
.modebar button{border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600}
.modebar button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kw-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.kw-card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:grid;gap:10px}
.kw-card.sel{border-color:color-mix(in srgb,var(--orange) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 10%,transparent)}
.kw-card.hidden{opacity:.55}
.kw-head{display:flex;gap:10px;align-items:flex-start}
.kw-head input[type=checkbox]{margin-top:6px}
.kw-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kw-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kw-fields .wide{grid-column:1/-1}
.helpbox{background:var(--pale);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
@media (max-width:760px){.li{grid-template-columns:1fr 1fr}.grid2,.catrow,.q-ed .r,.kw-fields{grid-template-columns:1fr}.kw-cards{grid-template-columns:1fr}}
</style></head><body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>v==null||v===''?'':Number(v).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const fdate=s=>s?new Date(s).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
async function api(p,opt={}){const r=await fetch(p,{credentials:'same-origin',headers:{'content-type':'application/json'},...opt});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='/api/admin/login'){showLogin();throw new Error('請重新登入');}if(!r.ok)throw new Error(j.error||'錯誤');return j;}
function armed(b,label,fn){if(b.dataset.armed!=='1'){const o=b.textContent;b.dataset.armed='1';b.textContent=label;b.classList.add('armed');setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent=o;b.classList.remove('armed');}},3500);return;}fn();}
let ME=null, C=null, sub='kw', periodId=null, catF='all', qF='', picked=new Set(), sortK='vol', kwMode='cards';

function shell(inner,title){return `<header class="top"><div class="wrap"><div class="brand">關鍵字主控台<small>MaKarma 瑪卡鎷行銷</small></div><div class="grow"></div>${title||''}<button class="btn sm" id="logout" style="background:transparent;color:#b9ccda;border-color:#2c5570">登出</button></div></header><main><div class="wrap">${inner}</div></main>`;}
function bindShell(){const l=$('#logout');if(l)l.onclick=async()=>{await api('/api/admin/logout',{method:'POST'});showLogin();};}
function showLogin(){$('#root').innerHTML=`<div class="gate"><form class="card" id="lf"><h1>關鍵字主控台</h1><p class="muted">請輸入管理密碼</p><input class="in" type="password" id="pw" autocomplete="current-password" style="letter-spacing:normal;font-size:16px;text-align:left" aria-label="管理密碼"><p id="le" class="small" style="color:var(--red);min-height:1.5em"></p><button class="btn primary" style="width:100%">登入</button></form></div>`;
  $('#pw').focus();$('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});route();}catch(err){$('#le').textContent=err.message;}};}
async function route(){
  try{ME=await api('/api/admin/me');}catch(e){return;}
  const h=location.hash.slice(1);
  if(h.startsWith('c/'))openClient(h.slice(2)); else listClients();
}
window.onhashchange=route;

/* ---------- client list ---------- */
async function listClients(){
  const cls=await api('/api/admin/clients');
  $('#root').innerHTML=shell(`
   <div class="row" style="margin-bottom:16px"><h1 class="grow">所有客戶</h1>${ME.notion?'<button class="btn" id="syncAll">從 Notion 同步已選字</button>':''}${ME.telegram?'<button class="btn" id="tgTest">發送測試通知</button>':''}<button class="btn" id="newHy">新增華邑</button><button class="btn primary" id="newC">新增客戶</button></div>
   <div id="syncOut"></div>
   ${ME.telegram?'':'<p class="small" style="color:var(--orange)">▸ 尚未設定 Telegram 通知：請在 Railway Variables 新增 TELEGRAM_BOT_TOKEN 與 TELEGRAM_CHAT_ID。</p>'}
   <form class="card" id="nf" hidden style="margin-bottom:18px"><div class="grid2"><div class="fld"><label>客戶名稱</label><input class="in" name="name" required></div><div class="fld"><label>客戶 PIN 碼（4–6 位數字）</label><input class="in" name="pin" inputmode="numeric" required></div><div class="fld"><label>第一期合約數</label><input class="in n" name="quota" type="number" value="20" min="1"></div></div><div class="row" style="margin-top:12px"><button class="btn primary">建立</button><button type="button" class="btn" id="nfc">取消</button></div></form>
   <div class="list">${cls.map(c=>{const s=c.stats,p=s.period;return `<div class="li" data-id="${c.id}" tabindex="0" role="link">
     <div><b>${esc(c.name)}</b>${c.archived?' <span class="chip">封存</span>':''}<div class="small muted">${s.keywords} 組候選字｜${s.periods} 期</div></div>
     <div>${p?`<div class="small">${esc(p.name)}${s.contract!=null?'｜合約 '+s.contract+'，過往 '+s.past:''}</div><div>本期已選 <b>${s.selected}</b>／${s.limit}</div><div class="bar2"><i style="width:${s.limit?Math.min(100,s.selected/s.limit*100):0}%"></i></div>`:'—'}</div>
     <div>${p?(p.status==='open'?'<span class="chip open">選字中</span>':'<span class="chip ok">已送出</span> <span class="small muted">'+fdate(p.submitted_at)+'</span>'):''}</div>
     <div class="small muted">客戶最後造訪<br>${fdate(c.last_client_at)}</div><div class="small muted">▸</div></div>`}).join('')||'<div class="empty">尚無客戶</div>'}</div>`);
  bindShell();
  document.querySelectorAll('.li').forEach(el=>{el.onclick=()=>location.hash='c/'+el.dataset.id;el.onkeydown=e=>{if(e.key==='Enter')el.click();};});
  const sa=$('#syncAll');if(sa)sa.onclick=async()=>{sa.disabled=true;sa.textContent='同步中…';try{const r=await api('/api/admin/notion-sync-all',{method:'POST'});
    $('#syncOut').innerHTML='<div class="card" style="margin-bottom:16px"><b>Notion 同步結果</b><ul class="small" style="margin:8px 0 0;padding-left:1.2em">'+r.map(x=>'<li>'+esc(x.name)+'：'+(x.ok?`合約 ${x.total??'—'} 組；新標記已選 ${x.marked} 組、新增 ${x.added} 組${x.onlyInSystem.length?'；系統有但 Notion 沒有：'+x.onlyInSystem.map(esc).join('、'):''}`:'<span style="color:var(--red)">'+esc(x.error)+'</span>')+'</li>').join('')+'</ul></div>';}catch(e){toast(e.message,true);}sa.disabled=false;sa.textContent='從 Notion 同步已選字';};
  const tt=$('#tgTest');if(tt)tt.onclick=()=>api('/api/admin/telegram-test',{method:'POST'}).then(()=>toast('已發送，請到 Telegram 確認')).catch(e=>toast(e.message,true));
  const hy=$('#newHy');if(hy)hy.onclick=async()=>{const exists=cls.find(c=>/華邑/.test(c.name));if(exists){location.hash='c/'+exists.id;return;}const pin=prompt('請設定華邑食品的客戶 PIN 碼（4–6 位數字）');if(!pin)return;try{const r=await api('/api/admin/clients',{method:'POST',body:JSON.stringify({name:'華邑食品',pin,quota:20})});toast('已新增華邑食品');location.hash='c/'+r.id;}catch(e){toast(e.message,true);}};
  $('#newC').onclick=()=>{$('#nf').hidden=false;$('#nf [name=name]').focus();};$('#nfc').onclick=()=>$('#nf').hidden=true;
  $('#nf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await api('/api/admin/clients',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});location.hash='c/'+r.id;}catch(err){toast(err.message,true);}};
}

/* ---------- client detail ---------- */
async function openClient(id,keep){
  C=await api('/api/admin/clients/'+id);
  if(!keep){periodId=null;catF='all';qF='';picked=new Set();}
  if(!periodId||!C.periods.find(p=>p.id===periodId))periodId=C.periods.length?C.periods[C.periods.length-1].id:null;
  const url=(ME.publicUrl||location.origin)+'/c/'+C.client.token;
  $('#root').innerHTML=shell(`
   <p class="small"><a href="#" id="back">◂ 所有客戶</a></p>
   <div class="row"><h1 class="grow">${esc(C.client.name)}</h1>${ME.notion?'<button class="btn" id="nSync">從 Notion 同步</button>':''}<a class="btn" href="/c/${C.client.token}" target="_blank" rel="noopener">以客戶畫面開啟</a></div>
   <div class="linkbox" style="margin-top:12px"><span class="muted">客戶連結</span><code id="url">${esc(url)}</code><button class="btn sm" id="copy">複製</button><span class="muted small">客戶需輸入 PIN 碼才能進入</span></div>
   <div class="sub" role="tablist">${[['kw','關鍵字'],['period','期別與合約'],['report','報告內容'],['iv','訪談表'],['set','設定']].map(([k,l])=>`<button data-s="${k}" aria-selected="${sub===k}">${l}</button>`).join('')}</div>
   <div id="body"></div>`);
  bindShell();
  $('#back').onclick=e=>{e.preventDefault();location.hash='';};
  const ns=$('#nSync');if(ns)ns.onclick=async()=>{ns.disabled=true;try{const r=await api('/api/admin/clients/'+C.client.id+'/notion-sync',{method:'POST'});toast(`Notion「${r.project}」：合約 ${r.contract_total??'—'} 組，新標記 ${r.marked.length} 組${r.onlyInSystem.length?'；系統多出：'+r.onlyInSystem.join('、'):''}`);reload();}catch(e){toast(e.message,true);ns.disabled=false;}};
  $('#copy').onclick=()=>{navigator.clipboard.writeText(url).then(()=>toast('已複製連結'));};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-selected',x===b));renderSub();});
  renderSub();
}
function renderSub(){({kw:subKw,period:subPeriod,report:subReport,iv:subIv,set:subSet})[sub]();}
const reload=()=>openClient(C.client.id,true);

/* keywords */
function catName(id){const c=C.cats.find(x=>x.id===id);return c?c.name:'未分類';}
function subKw(){
  const P=C.periods.find(p=>p.id===periodId);
  const selSet=new Set(C.sels.filter(s=>s.period_id===periodId).map(s=>s.keyword_id));
  const pastSet={};C.sels.filter(s=>s.period_id!==periodId).forEach(s=>{pastSet[s.keyword_id]=C.periods.find(p=>p.id===s.period_id)?.name;});
  const qq=qF.trim().toLowerCase();
  let ks=C.kws.filter(k=>(catF==='all'||(catF===''?!k.category_id:k.category_id===catF))&&(!qq||k.kw.toLowerCase().includes(qq)||(k.note||'').toLowerCase().includes(qq)||(k.intent||'').toLowerCase().includes(qq)||(k.content||'').toLowerCase().includes(qq)));
  ks.sort((a,b)=>sortK==='vol'?((b.vol??-1)-(a.vol??-1)):sortK==='hi'?((b.hi??-1)-(a.hi??-1)):sortK==='sel'?((selSet.has(b.id))-(selSet.has(a.id))):a.kw.localeCompare(b.kw));
  const catOpts=(v)=>`<option value="">未分類</option>`+C.cats.map(c=>`<option value="${c.id}" ${c.id===v?'selected':''}>${esc(c.name)}</option>`).join('');
  const flag=k=>`${pastSet[k.id]?`<span class="chip past">已在 ${esc(pastSet[k.id])}</span>`:`<label class="small"><input type="checkbox" data-sel="${k.id}" ${selSet.has(k.id)?'checked':''}> 本期選用</label>`}${k.hidden?' <span class="chip">隱藏</span>':''}${k.rec?' <span class="chip rec">顧問推薦</span>':''}`;
  const tableView=`<div class="tbl-scroll"><table class="ed"><thead><tr><th><input type="checkbox" id="pickAll" aria-label="全選"></th><th>本期選用</th><th>關鍵字</th><th>分類</th><th class="num">月搜尋量</th><th class="num">頁首出價上限</th><th>為什麼選這個字</th><th>建議文章</th><th>可導向</th><th>備註</th><th>推薦</th></tr></thead><tbody>
  ${ks.map(k=>`<tr class="${selSet.has(k.id)?'sel':''}" ${k.hidden?'style="opacity:.45"':''}><td><input type="checkbox" data-pick="${k.id}" ${picked.has(k.id)?'checked':''} aria-label="選取列"></td>
   <td>${pastSet[k.id]?`<span class="chip past">${esc(pastSet[k.id])}</span>`:`<input type="checkbox" data-sel="${k.id}" ${selSet.has(k.id)?'checked':''} aria-label="本期選用">`}${k.hidden?' <span class="chip">隱藏</span>':''}</td>
   <td><input class="in" data-f="kw" data-k="${k.id}" value="${esc(k.kw)}" style="min-width:12em"></td>
   <td><select class="in" data-f="category_id" data-k="${k.id}" style="min-width:8em">${catOpts(k.category_id)}</select></td>
   <td><input class="in n" data-f="vol" data-k="${k.id}" type="number" value="${k.vol??''}" style="width:6.5em"></td>
   <td><input class="in n" data-f="hi" data-k="${k.id}" type="number" step="0.01" value="${k.hi??''}" style="width:6.5em"></td>
   <td><input class="in" data-f="intent" data-k="${k.id}" value="${esc(k.intent)}" style="min-width:10em"></td>
   <td><input class="in" data-f="content" data-k="${k.id}" value="${esc(k.content)}" style="min-width:10em"></td>
   <td><input class="in" data-f="path" data-k="${k.id}" value="${esc(k.path)}" style="min-width:10em"></td>
   <td><input class="in" data-f="note" data-k="${k.id}" value="${esc(k.note)}" style="min-width:8em"></td>
   <td><input type="checkbox" data-f="rec" data-k="${k.id}" ${k.rec?'checked':''} aria-label="顧問推薦"></td></tr>`).join('')}
  </tbody></table></div>`;
  const cardView=`<div class="kw-cards">${ks.map(k=>`<section class="kw-card ${selSet.has(k.id)?'sel':''} ${k.hidden?'hidden':''}">
    <div class="kw-head"><input type="checkbox" data-pick="${k.id}" ${picked.has(k.id)?'checked':''} aria-label="選取這組關鍵字"><div class="grow"><label class="small muted">關鍵字</label><input class="in" data-f="kw" data-k="${k.id}" value="${esc(k.kw)}"></div></div>
    <div class="kw-meta">${flag(k)}<label class="small"><input type="checkbox" data-f="rec" data-k="${k.id}" ${k.rec?'checked':''}> 顧問推薦</label></div>
    <div class="kw-fields"><div class="fld"><label>分類</label><select class="in" data-f="category_id" data-k="${k.id}">${catOpts(k.category_id)}</select></div><div class="fld"><label>月搜尋量</label><input class="in n" data-f="vol" data-k="${k.id}" type="number" value="${k.vol??''}"></div><div class="fld"><label>頁首出價上限</label><input class="in n" data-f="hi" data-k="${k.id}" type="number" step="0.01" value="${k.hi??''}"></div><div class="fld"><label>可導向頁面</label><input class="in" data-f="path" data-k="${k.id}" value="${esc(k.path)}"></div><div class="fld wide"><label>為什麼選這個字</label><textarea class="in" data-f="intent" data-k="${k.id}">${esc(k.intent)}</textarea></div><div class="fld wide"><label>建議文章</label><textarea class="in" data-f="content" data-k="${k.id}">${esc(k.content)}</textarea></div><div class="fld wide"><label>內部備註</label><textarea class="in" data-f="note" data-k="${k.id}">${esc(k.note)}</textarea></div></div>
  </section>`).join('')||'<div class="empty">沒有符合條件的關鍵字</div>'}</div>`;
  $('#body').innerHTML=`
  <div class="helpbox" style="margin-bottom:14px"><b>編輯提示</b><div class="small muted">卡片模式適合逐題編修，修改欄位後離開欄位會自動儲存；需要大量貼資料或快速掃描時，可切回表格模式。</div></div>
  <details class="card" style="margin-bottom:14px"><summary><b>分類管理</b> <span class="muted small">（${C.cats.length} 個分類，客戶頁依此分組）</span></summary><div style="margin-top:12px">
   ${C.cats.map((c,i)=>`<div class="catrow"><input class="in" data-cn="${c.id}" value="${esc(c.name)}" aria-label="分類名稱"><input class="in" data-cnote="${c.id}" value="${esc(c.note)}" placeholder="分類說明（客戶會看到）" aria-label="分類說明"><span class="small muted">${C.kws.filter(k=>k.category_id===c.id).length} 組</span><button class="btn sm danger" data-cdel="${c.id}">刪除</button></div>`).join('')}
   <div class="row" style="margin-top:8px"><input class="in" id="newCat" placeholder="新分類名稱" style="max-width:260px"><button class="btn sm" id="addCat">新增分類</button><span class="small muted">刪除分類時，其中的字會移到「未分類」</span></div></div></details>
  <details class="card" style="margin-bottom:14px"><summary><b>匯入關鍵字</b> <span class="muted small">（Keyword Planner CSV 或直接貼上）</span></summary><div style="margin-top:12px">
   <p class="small muted">可上傳 Keyword Planner 匯出的 CSV，或從試算表貼上三欄：關鍵字、月搜尋量、頁首出價上限（Tab 分隔）。已存在的字只更新數據。</p>
   <div class="row"><select class="in" id="impCat" style="max-width:220px">${catOpts(catF!=='all'?catF:'')}</select><input type="file" id="impFile" accept=".csv,.tsv,.txt"><button class="btn sm" id="impGo">匯入貼上的內容</button></div>
   <textarea class="in" id="impText" rows="4" style="margin-top:8px" placeholder="關鍵字&#9;月搜尋量&#9;頁首出價上限"></textarea></div></details>
  <div class="stick"><div class="row">
   <label class="small muted">檢視期別</label><select class="in" id="pSel" style="max-width:220px">${C.periods.map(p=>`<option value="${p.id}" ${p.id===periodId?'selected':''}>${esc(p.name)}（${p.status==='open'?'選字中':'已送出'}）</option>`).join('')}</select>
   ${P?`<span>已選 <b>${selSet.size}</b>${C.client.contract_total!=null?'':'／'+P.quota}</span>`:''}
   <select class="in" id="cF" style="max-width:180px"><option value="all">全部分類</option>${catOpts(catF).replace('value=""','value=""'+(catF===''?' selected':''))}</select>
   <input class="in" id="qF" placeholder="搜尋關鍵字、備註、選字理由" value="${esc(qF)}" style="max-width:220px">

}
const clean=v=>{if(v==null)return null;const s=String(v).replace(/[^0-9.]/g,'');return s===''?null:Number(s);};
async function doImport(rows){try{const r=await api('/api/admin/clients/'+C.client.id+'/keywords',{method:'POST',body:JSON.stringify({rows,category_id:$('#impCat').value||null})});toast(`新增 ${r.added} 組、更新 ${r.updated} 組`);reload();}catch(e){toast(e.message,true);}}
async function parseKP(file){const buf=await file.arrayBuffer();const u8=new Uint8Array(buf);let enc='utf-8';if(u8[0]===0xFF&&u8[1]===0xFE)enc='utf-16le';else if(u8[0]===0xFE&&u8[1]===0xFF)enc='utf-16be';else if(u8.length>3&&u8[1]===0&&u8[3]===0)enc='utf-16le';
  const text=new TextDecoder(enc).decode(buf).replace(/^\uFEFF/,'');const lines=text.split(/\r?\n/).filter(l=>l.trim());const delim=lines.some(l=>l.includes('\t'))?'\t':',';
  const split=l=>{if(delim==='\t')return l.split('\t').map(s=>s.replace(/^"|"$/g,'').trim());const o=[];let cur='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(cur.trim());cur='';}else cur+=ch;}o.push(cur.trim());return o;};
  const hi=lines.findIndex(l=>/關鍵字|Keyword/i.test(l)&&/搜尋|search/i.test(l));if(hi<0){toast('找不到 Keyword Planner 的欄位標題',true);return null;}
  const H=split(lines[hi]);const col=(...p)=>H.findIndex(h=>p.some(x=>x.test(h)));
  const cK=col(/^關鍵字$/,/^Keyword$/i),cV=col(/平均每月搜尋/,/Avg\.? monthly searches/i),cH=col(/(頁首|首頁).*高/,/Top of page bid \(high/i);
  const cC=H.findIndex(h=>(/^競爭/.test(h)||/^Competition$/i.test(h))&&!/索引|index/i.test(h));
  const cm=v=>!v?'':/低|low/i.test(v)?'低':/中|medium/i.test(v)?'中':/高|high/i.test(v)?'高':'';
  return lines.slice(hi+1).map(split).filter(c=>c[cK]).map(c=>({kw:c[cK],vol:cV>=0?clean(c[cV]):null,hi:cH>=0?clean(c[cH]):null,comp:cC>=0?cm(c[cC]):''}));}

  $('#sPinB').onclick=()=>api('/api/admin/clients/'+C.client.id,{method:'PATCH',body:JSON.stringify({pin:$('#sPin').value.trim()})}).then(()=>{toast('PIN 已更新');$('#sPin').value='';}).catch(e=>toast(e.message,true));
  $('#sTok').onclick=e=>armed(e.target,'確定重新產生',()=>api('/api/admin/clients/'+C.client.id,{method:'PATCH',body:JSON.stringify({resetToken:true})}).then(()=>{toast('已產生新連結');reload();}));
  $('#sArc').onclick=()=>api('/api/admin/clients/'+C.client.id,{method:'PATCH',body:JSON.stringify({archived:!C.client.archived})}).then(reload);
}
route();
</script></body></html>
